name: Build APK with Briefcase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
        pip install briefcase
    
    - name: Build APK
      run: |
        briefcase create android
        briefcase build android
        briefcase package android -p apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartGloveApp-APK
        path: dist/*.apk
